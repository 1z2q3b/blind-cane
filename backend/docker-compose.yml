# =============================================================
# 备选方案：用 Docker 起一套干净的 MySQL + Redis。
# 注意：本机 Docker daemon 当前未运行，默认开发环境请用本机已装好的
#       MySQL 8 (3306) + Redis (D:\redis)，不要依赖本文件。
# 若使用本文件，请把 application-dev.yml 里的端口改成 3307 / 6380。
# =============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: blindcane-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: blindcane
      MYSQL_DATABASE: blind_cane_guardian
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      # 映射到 3307，避免与本机 3306 上的 MySQL 冲突
      - "3307:3306"
    volumes:
      - blindcane-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pblindcane" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blindcane-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      # 映射到 6380，避免与本机 6379 冲突
      - "6380:6379"
    volumes:
      - blindcane-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  blindcane-mysql-data:
  blindcane-redis-data:
